name: "Upstream check"

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
    inputs:
      base:
        description: "Branch or tag in this fork to compare upstream against"
        default: main

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM: elsbrock
      BASE: ${{ inputs.base || 'main' }}
      TITLE: "Upstream elsbrock/plundrio is ahead of the fork"
    steps:
      - name: Compare with upstream
        run: |
          set -euo pipefail

          compare=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BASE}...${UPSTREAM}:main")
          ahead=$(jq -r '.ahead_by' <<<"$compare")
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')

          if [ "$ahead" = "0" ]; then
            echo "Fork is level with upstream."
            if [ -n "$open" ]; then
              gh issue close "$open" --repo "$GITHUB_REPOSITORY" --comment "The fork is level with upstream again."
            fi
            exit 0
          fi

          release=$(gh api repos/${UPSTREAM}/plundrio/releases/latest --jq .tag_name 2>/dev/null || echo "none")
          touched=$(jq -r '[.files[].filename | select(test("^internal/(download|server|api)/"))] | length' <<<"$compare")
          commits=$(jq -r '.commits[] | "- `\(.sha[0:7])` \(.commit.message | split("\n")[0])"' <<<"$compare")

          {
            echo "Upstream \`${UPSTREAM}/plundrio\` has ${ahead} commit(s) that \`${BASE}\` in this fork does not."
            echo
            echo "Latest upstream release: \`${release}\`"
            if [ "$touched" != "0" ]; then
              echo
              echo "**${touched} changed file(s) are in \`internal/download\`, \`internal/server\` or \`internal/api\`**, where the fork's fixes live. Check whether upstream now fixes the same problems."
            fi
            echo
            echo "$commits"
            echo
            echo "To update:"
            echo
            echo '```bash'
            echo "git fetch upstream"
            echo "git merge upstream/main"
            echo "go test -race ./..."
            echo '```'
          } >body.md

          if [ -n "$open" ]; then
            gh issue edit "$open" --repo "$GITHUB_REPOSITORY" --body-file body.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file body.md
          fi
